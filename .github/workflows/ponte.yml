name: ponte
on:
  push:
    branches: [main]
    paths: ['ponte/**', '.github/workflows/ponte.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: ponte
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publicar no Cloudflare
        id: pub
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ponte
      - name: Testar
        env:
          SAIDA: ${{ steps.pub.outputs.command-output }}
        run: |
          URL=$(echo "$SAIDA" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          echo "endereco: $URL"
          mkdir -p ponte/amostras
          echo "$URL" > ponte/amostras/endereco.txt
          curl -s "$URL/busca?nome=Myrae" | tee ponte/amostras/busca.json | head -c 1500; echo
          ID=$(jq -r '.lista[0].id // empty' ponte/amostras/busca.json); SV=$(jq -r '.lista[0].servidor // empty' ponte/amostras/busca.json)
          [ -n "$ID" ] && curl -s -G "$URL/ficha" --data-urlencode "servidor=$SV" --data-urlencode "id=$ID" | jq . > ponte/amostras/ficha.json || true
          head -c 3000 ponte/amostras/ficha.json || true
      - name: Guardar amostras
        if: always()
        run: |
          git config user.name "robo-aion2brasil"
          git config user.email "robo-aion2brasil@users.noreply.github.com"
          git add -A ponte/amostras || true
          git commit -m "Ponte: amostras do teste" || exit 0
          git pull --rebase -X theirs origin main || true
          git push
