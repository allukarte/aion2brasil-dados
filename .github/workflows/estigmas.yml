name: estigmas
# Conta as Estigmas equipadas pelos personagens com mais CP de cada classe (rodar à mão).
on:
  workflow_dispatch:
    inputs:
      top:
        description: 'personagens por classe'
        default: '100'
permissions:
  contents: write
concurrency: estigmas
jobs:
  contar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Contar
        run: |
          python3 estigmas/contar.py ${{ github.event.inputs.top || '100' }}
          cat estigmas-resumo.md >> "$GITHUB_STEP_SUMMARY"
          rm estigmas-resumo.md
      - name: Guardar
        run: |
          git config user.name "robo-aion2brasil"
          git config user.email "robo-aion2brasil@users.noreply.github.com"
          git add dados/
          git commit -m "Estigmas dos melhores de cada classe: $(date -u +%F)" || exit 0
          git pull --rebase -X theirs origin main || true
          git push
